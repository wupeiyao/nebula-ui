<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients (Dreamy Sky Blue & Peach Pink Theme "桃桃蓝粉风格") -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="35%" stop-color="#fce7f3" />
      <stop offset="70%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="gamepad-body-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="gamepad-body-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#db2777" flood-opacity="0.1" />
    </filter>

    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.12" />
    </filter>

    <filter id="blur-bg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="75" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f472b6" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="1000" fill="url(#bg-grad)" />
  <rect width="800" height="1000" fill="url(#grid-pattern)" />

  <!-- Ambient Light Orbs (Blue + Peach Pink Blend) -->
  <circle cx="180" cy="220" r="230" fill="#f472b6" opacity="0.4" filter="url(#blur-bg)" />
  <circle cx="620" cy="340" r="220" fill="#93c5fd" opacity="0.45" filter="url(#blur-bg)" />
  <circle cx="360" cy="620" r="250" fill="#fbcfe8" opacity="0.55" filter="url(#blur-bg)" />
  <circle cx="650" cy="720" r="180" fill="#c4b5fd" opacity="0.35" filter="url(#blur-bg)" />

  <!-- Decorative Graphic Circles & Tech Lines -->
  <g opacity="0.9">
    <circle cx="400" cy="360" r="280" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="400" cy="360" r="200" fill="none" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="400" cy="360" r="130" fill="none" stroke="#ec4899" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="10 8" />
  </g>

  <!-- Sparkles & Floating Dots -->
  <g fill="#f472b6">
    <path d="M140 180 Q140 192 152 192 Q140 192 140 204 Q140 192 128 192 Q140 192 140 180 Z" opacity="0.85" fill="#ec4899" />
    <path d="M660 200 Q660 214 674 214 Q660 214 660 228 Q660 214 646 214 Q660 214 660 200 Z" opacity="0.8" fill="#3b82f6" />
    <path d="M200 520 Q200 528 208 528 Q200 528 200 536 Q200 528 192 528 Q200 528 200 520 Z" opacity="0.75" fill="#f472b6" />
    <path d="M670 470 Q670 478 678 478 Q670 478 670 486 Q670 478 662 478 Q670 478 670 470 Z" opacity="0.8" fill="#38bdf8" />
    <circle cx="160" cy="310" r="3" fill="#f472b6" opacity="0.7" />
    <circle cx="620" cy="130" r="3" fill="#93c5fd" opacity="0.7" />
    <circle cx="280" cy="130" r="2" fill="#ec4899" opacity="0.5" />
    <circle cx="540" cy="580" r="3" fill="#f472b6" opacity="0.6" />
  </g>

  <!-- Voice Wave Graphic Elements (Pink-Blue Dual Theme) -->
  <g transform="translate(60, 220)" opacity="0.8">
    <rect x="0" y="20" width="4" height="24" rx="2" fill="#3b82f6" opacity="0.5" />
    <rect x="8" y="10" width="4" height="44" rx="2" fill="#f472b6" opacity="0.8" />
    <rect x="16" y="0" width="4" height="64" rx="2" fill="#ec4899" opacity="0.95" />
    <rect x="24" y="14" width="4" height="36" rx="2" fill="#60a5fa" opacity="0.7" />
    <rect x="32" y="24" width="4" height="16" rx="2" fill="#f472b6" opacity="0.4" />
  </g>

  <!-- Central Illustration Group -->
  <g transform="translate(0, -20)">
    
    <!-- Connection Beam between Gamepads -->
    <path d="M 280 340 C 340 270, 460 410, 520 350" fill="none" stroke="url(#accent-pink)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.65" />

    <!-- Gamepad 1 (Client / Player 1) - Dreamy Blue with Pink Accents -->
    <g transform="translate(170, 230) rotate(-10)" filter="url(#shadow-soft)">
      <!-- Body -->
      <rect x="0" y="0" width="260" height="150" rx="42" fill="url(#gamepad-body-1)" stroke="#bae6fd" stroke-width="2" />
      
      <!-- D-Pad -->
      <g transform="translate(52, 48)">
        <rect x="15" y="0" width="14" height="44" rx="4" fill="#e0f2fe" />
        <rect x="0" y="15" width="44" height="14" rx="4" fill="#e0f2fe" />
        <polygon points="22,4 17,10 27,10" fill="#3b82f6" />
        <polygon points="22,40 17,34 27,34" fill="#94a3b8" />
        <polygon points="4,22 10,17 10,27" fill="#94a3b8" />
        <polygon points="40,22 34,17 34,27" fill="#94a3b8" />
      </g>

      <!-- Action Buttons (XYAB) -->
      <g transform="translate(160, 42)">
        <circle cx="22" cy="8" r="9.5" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" />
        <text x="22" y="11.5" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#ec4899" text-anchor="middle" dominant-baseline="middle">Y</text>
        
        <circle cx="8" cy="22" r="9.5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
        <text x="8" y="25.5" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="middle">X</text>

        <circle cx="36" cy="22" r="9.5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
        <text x="36" y="25.5" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="middle">B</text>

        <circle cx="22" cy="36" r="10" fill="url(#accent-blue)" />
        <text x="22" y="39.5" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">A</text>
      </g>

      <!-- Joysticks & Center Details -->
      <circle cx="102" cy="94" r="15" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2" />
      <circle cx="102" cy="94" r="6" fill="#3b82f6" />
      
      <circle cx="154" cy="94" r="15" fill="#fdf2f8" stroke="#f472b6" stroke-width="2" />
      <circle cx="154" cy="94" r="6" fill="#f472b6" />

      <!-- Center Light Indicator -->
      <rect x="118" y="44" width="24" height="6" rx="3" fill="#ec4899" />
    </g>

    <!-- Gamepad 2 (Playmate / Player 2) - Sweet Peach Pink Styling -->
    <g transform="translate(360, 310) rotate(12)" filter="url(#shadow-soft)">
      <!-- Body -->
      <rect x="0" y="0" width="260" height="150" rx="42" fill="url(#gamepad-body-2)" stroke="#fbcfe8" stroke-width="2" />
      
      <!-- D-Pad -->
      <g transform="translate(52, 48)">
        <rect x="15" y="0" width="14" height="44" rx="4" fill="#fce7f3" />
        <rect x="0" y="15" width="44" height="14" rx="4" fill="#fce7f3" />
        <polygon points="22,4 17,10 27,10" fill="#ec4899" />
      </g>

      <!-- Action Buttons -->
      <g transform="translate(160, 42)">
        <circle cx="22" cy="8" r="9.5" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" />
        <text x="22" y="11.5" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#db2777" text-anchor="middle" dominant-baseline="middle">Y</text>
        
        <circle cx="8" cy="22" r="9.5" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" />
        <text x="8" y="25.5" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#db2777" text-anchor="middle" dominant-baseline="middle">X</text>

        <circle cx="36" cy="22" r="10" fill="url(#accent-pink)" />
        <text x="36" y="25.5" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">B</text>

        <circle cx="22" cy="36" r="9.5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
        <text x="22" y="39.5" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="middle">A</text>
      </g>

      <!-- Joysticks -->
      <circle cx="102" cy="94" r="15" fill="#fce7f3" stroke="#ec4899" stroke-width="2" />
      <circle cx="102" cy="94" r="6" fill="#ec4899" />
      
      <circle cx="154" cy="94" r="15" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2" />
      <circle cx="154" cy="94" r="6" fill="#3b82f6" />

      <!-- Center Light Indicator -->
      <rect x="118" y="44" width="24" height="6" rx="3" fill="#f472b6" />
    </g>

    <!-- Floating Cards (Fresh Glassmorphism Cards) -->
    
    <!-- Badge 1: DUO 组队上分 (Top Left - Pink Accent) -->
    <g transform="translate(130, 155)" filter="url(#shadow-card)">
      <rect x="0" y="0" width="170" height="56" rx="16" fill="url(#card-bg)" stroke="#fbcfe8" stroke-width="1.5" />
      <circle cx="28" cy="28" r="15" fill="url(#accent-pink)" />
      <!-- Heart Icon -->
      <path d="M 23 26 C 23 23, 27 21, 28 24 C 29 21, 33 23, 33 26 C 33 29, 28 32, 28 32 C 28 32, 23 29, 23 26 Z" fill="#ffffff" />
      <text x="52" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b">DUO 组队上分</text>
      <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">大神带飞 · 轻松连胜</text>
    </g>

    <!-- Badge 2: 实时语音连麦 (Top Right - Blue Cyan Accent) -->
    <g transform="translate(490, 185)" filter="url(#shadow-card)">
      <rect x="0" y="0" width="170" height="56" rx="16" fill="url(#card-bg)" stroke="#bae6fd" stroke-width="1.5" />
      <circle cx="28" cy="28" r="15" fill="url(#accent-cyan)" />
      <!-- Headset Icon -->
      <path d="M 21 28 A 7 7 0 0 1 35 28 V 32 A 2 2 0 0 1 33 34 H 32 V 28 H 34 V 28 A 6 6 0 0 0 22 28 V 28 H 24 V 34 H 23 A 2 2 0 0 1 21 32 Z" fill="#ffffff" />
      <text x="52" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b">实时语音连麦</text>
      <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">高清音质 · 专属陪伴</text>
    </g>

    <!-- Badge 3: 严选优质陪玩 (Bottom Right - Soft Peach Crown Theme) -->
    <g transform="translate(470, 495)" filter="url(#shadow-card)">
      <rect x="0" y="0" width="180" height="58" rx="16" fill="url(#card-bg)" stroke="#fbcfe8" stroke-width="1.5" />
      <circle cx="28" cy="29" r="15" fill="url(#accent-gold)" />
      <!-- Star / Crown Icon -->
      <polygon points="28,20 31,26 37,26 32,30 34,36 28,32 22,36 24,30 19,26 25,26" fill="#ffffff" />
      <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b">严选优质陪玩</text>
      <circle cx="56" cy="40" r="3.5" fill="#ec4899" />
      <text x="64" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#db2777">VIP老板在线匹配</text>
    </g>

    <!-- Bottom Fading Waves (Pink + Sky Blue) -->
    <path d="M 80 670 Q 240 610, 400 650 T 720 630" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.35" />
    <path d="M 60 700 Q 270 650, 480 690 T 760 660" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.3" />
  </g>
</svg>
